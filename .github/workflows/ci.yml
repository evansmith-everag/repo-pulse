name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going, which also keeps the live GitHub runs within budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22 # the oldest supported line (engines in package.json): the server suite against live GitHub
            live: true
          - node: 26 # the current line: the server suite in fixture mode, plus the browser suite (live)
            ui: true
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Server tests
        run: npm run test:server
        env:
          TEST_LIVE: ${{ matrix.live && '1' || '0' }}
          GITHUB_TOKEN: ${{ matrix.live && secrets.GITHUB_TOKEN || '' }}
      - name: Browser tests
        if: matrix.ui
        run: npm run test:ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
